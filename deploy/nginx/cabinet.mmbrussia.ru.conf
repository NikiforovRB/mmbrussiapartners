# Реверс-прокси для личного кабинета MMB RUSSIA.
# TLS терминируется здесь, приложение слушает 127.0.0.1:3000 по http.
# Файл кладётся в /etc/nginx/sites-available/ и линкуется в sites-enabled/.

# HTTP: пропускаем ACME-проверку certbot и уводим всё остальное на https.
server {
    listen 80;
    listen [::]:80;
    server_name cabinet.mmbrussia.ru;

    # Выпуск/продление сертификата Let's Encrypt (webroot).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    # HTTP/2 включаем в директиве listen: так работает и на nginx 1.24
    # (Ubuntu 24.04 LTS), и на новых версиях. Отдельная директива "http2 on;"
    # появилась только в nginx 1.25.1 и на 1.24 роняет конфиг.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name cabinet.mmbrussia.ru;

    ssl_certificate     /etc/letsencrypt/live/cabinet.mmbrussia.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cabinet.mmbrussia.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:MozSSL:10m;

    # Загрузка отчётов/файлов — поднимаем лимит тела запроса.
    client_max_body_size 25m;

    # HSTS: переключаемся на https навсегда (после проверки, что всё работает).
    # Приложение в production шлёт такой же заголовок — его скрываем ниже,
    # чтобы в ответе был ровно один (в том числе на ошибках nginx).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_hide_header Strict-Transport-Security;

        # Заголовки, по которым Next/Auth.js понимают исходный протокол и IP.
        # useSecureCookies включается по https в NEXTAUTH_URL, а X-Forwarded-Proto
        # должен приходить как https, иначе редиректы и cookie поедут.
        # IP клиента для rate-limit берётся из X-Real-IP. X-Forwarded-For
        # перезаписываем, а не дополняем: присланный клиентом заголовок
        # позволил бы подставлять чужие адреса.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;

        # Поддержка websockets/HMR-совместимых соединений.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Генерация XLSX-отчётов может быть небыстрой.
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }
}
