name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Пустая БД только для проверки drift; рабочая БД в CI не используется.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: drift
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci -d drift"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/drift
      DIRECT_URL: postgresql://ci:ci@localhost:5432/drift
      DRIFT_DATABASE_URL: postgresql://ci:ci@localhost:5432/drift
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      # Как на ВМ: Node 20 + npm 11. npm 10 из комплекта Node 20 иначе трактует
      # опциональные peer-зависимости и отвергает lock-файл.
      - run: npm install -g npm@11

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npx next lint --dir src

      - name: Schema drift (migrations vs schema.prisma)
        run: npm run db:drift
